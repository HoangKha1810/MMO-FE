# Nginx fallback maintenance config for TRUNGTAMMMO.VN.
# Copy this file to /etc/nginx/sites-available/trungtammmo.vn
# then symlink it into /etc/nginx/sites-enabled/.
#
# This config does two things:
# 1. Proxies traffic to Next.js at http://127.0.0.1:3000 while npm run start is alive.
# 2. Shows /var/www/trungtammmo-maintenance/maintenance-static.html when Next.js is down
#    or when /var/www/trungtammmo-maintenance/maintenance.flag exists.

upstream trungtammmo_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name trungtammmo.vn www.trungtammmo.vn;

    # If you already use Certbot, this server block may be managed by Certbot.
    # Keep or adapt your existing HTTPS redirect if needed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trungtammmo.vn www.trungtammmo.vn;

    # Update these paths to match your real certificate paths.
    ssl_certificate /etc/letsencrypt/live/trungtammmo.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trungtammmo.vn/privkey.pem;

    root /var/www/trungtammmo-maintenance;
    index maintenance-static.html;

    # Manual maintenance switch:
    #   ON:  sudo touch /var/www/trungtammmo-maintenance/maintenance.flag && sudo nginx -s reload
    #   OFF: sudo rm /var/www/trungtammmo-maintenance/maintenance.flag && sudo nginx -s reload
    if (-f /var/www/trungtammmo-maintenance/maintenance.flag) {
        return 503;
    }

    location / {
        proxy_pass http://trungtammmo_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # When Next.js is stopped, unreachable, or returns gateway errors,
        # show the static maintenance page instead.
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 /maintenance-static.html;
    }

    location = /maintenance-static.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /maintenance-static.html =503;
    }

    error_page 503 /maintenance-static.html;
}
