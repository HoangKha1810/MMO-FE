worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream trungtammmo_nextjs {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name trungtammmo.vn www.trungtammmo.vn trungtammmo.com www.trungtammmo.com;

        return 301 https://trungtammmo.vn$request_uri;
    }

    server {
        listen 443 ssl;
        server_name trungtammmo.vn www.trungtammmo.vn;

        ssl_certificate     "C:/nginx/ssl/trungtammmo.vn/trungtammmo.vn-chain.pem";
        ssl_certificate_key "C:/nginx/ssl/trungtammmo.vn/trungtammmo.vn-key.pem";

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root C:/nginx/html/maintenance;
        index maintenance-static.html;

        error_page 500 502 503 504 =503 /maintenance-static.html;

        location = /maintenance-static.html {
            root C:/nginx/html/maintenance;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location / {
            # Manual maintenance switch:
            #   ON:  New-Item C:\\nginx\\html\\maintenance\\maintenance.flag -ItemType File -Force; C:\\nginx\\nginx.exe -s reload
            #   OFF: Remove-Item C:\\nginx\\html\\maintenance\\maintenance.flag -Force; C:\\nginx\\nginx.exe -s reload
            if (-f C:/nginx/html/maintenance/maintenance.flag) {
                return 503;
            }

            proxy_pass http://trungtammmo_nextjs;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # If npm run start is stopped or Next.js returns 50x,
            # Nginx serves C:/nginx/html/maintenance/maintenance-static.html.
            proxy_intercept_errors on;
        }
    }

    server {
        listen 443 ssl;
        server_name trungtammmo.com www.trungtammmo.com;

        ssl_certificate     "C:/nginx/ssl/trungtammmo.vn/trungtammmo.vn-chain.pem";
        ssl_certificate_key "C:/nginx/ssl/trungtammmo.vn/trungtammmo.vn-key.pem";

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://trungtammmo.vn$request_uri;
    }
}
