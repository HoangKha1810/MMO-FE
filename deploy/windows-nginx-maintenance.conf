# Windows Nginx config for TRUNGTAMMMO.VN maintenance fallback.
# Put this content into C:/nginx/conf/nginx.conf, or copy the server/upstream
# blocks into your existing nginx.conf.
#
# Flow:
# - Nginx listens on port 80.
# - Next.js runs with npm run start on http://127.0.0.1:3000.
# - If Next.js is stopped, Nginx shows C:/nginx/html/maintenance/maintenance-static.html.
# - If C:/nginx/html/maintenance/maintenance.flag exists, Nginx forces maintenance.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream trungtammmo_nextjs {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name trungtammmo.vn www.trungtammmo.vn _;

        root C:/nginx/html/maintenance;
        index maintenance-static.html;

        # Manual maintenance switch:
        #   ON:  New-Item C:\\nginx\\html\\maintenance\\maintenance.flag -ItemType File -Force; C:\\nginx\\nginx.exe -s reload
        #   OFF: Remove-Item C:\\nginx\\html\\maintenance\\maintenance.flag -Force; C:\\nginx\\nginx.exe -s reload
        if (-f C:/nginx/html/maintenance/maintenance.flag) {
            return 503;
        }

        location / {
            proxy_pass http://trungtammmo_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # If npm run start is stopped or Next.js returns 50x,
            # Nginx serves the maintenance page.
            proxy_intercept_errors on;
            error_page 500 502 503 504 =503 /maintenance-static.html;
        }

        location = /maintenance-static.html {
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files /maintenance-static.html =503;
        }

        error_page 503 /maintenance-static.html;
    }
}
